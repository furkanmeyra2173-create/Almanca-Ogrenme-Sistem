name: Build Android APKS

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.9'

      - name: Build Android App Bundle
        run: gradle bundleDebug

      - name: Create debug signing key
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Sign bundle
        run: |
          jarsigner -keystore debug.keystore -storepass android -keypass android app/build/outputs/bundle/debug/app-debug.aab androiddebugkey

      - name: Download bundletool
        run: curl -L --fail --retry 3 https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar -o bundletool.jar

      - name: Generate universal APKS file
        run: |
          java -jar bundletool.jar build-apks \
            --bundle=app/build/outputs/bundle/debug/app-debug.aab \
            --output=Ag-Yonetimi.apks \
            --mode=universal \
            --ks=debug.keystore \
            --ks-pass=pass:android \
            --ks-key-alias=androiddebugkey \
            --key-pass=pass:android \
            --overwrite
          unzip -p Ag-Yonetimi.apks universal.apk > Ag-Yonetimi.apk
          test -s Ag-Yonetimi.apk

      - name: Upload installable APK and APKS artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ag-Yonetimi-Android
          path: |
            Ag-Yonetimi.apk
            Ag-Yonetimi.apks
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: v1.0.0-build.${{ github.run_number }}
        run: |
          gh release create "$TAG_NAME" Ag-Yonetimi.apk Ag-Yonetimi.apks \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Ağ Yönetimi Android $TAG_NAME" \
            --notes "Automated Android build. Ag-Yonetimi.apk is the installable universal APK. Ag-Yonetimi.apks is the bundletool package. This build currently includes VPN service scaffolding only; it does not route internet traffic until an upstream VPN endpoint/protocol is configured."
